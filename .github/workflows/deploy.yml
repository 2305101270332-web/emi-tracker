# Continuous deployment: every push to main is tested, then deployed to Cloudflare.
#
# Order matters: D1 migrations -> API Worker -> web app (Pages), so new code never
# runs against an old schema and the Pages proxy always finds the Worker.
#
# Needs (repo Settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN   (Workers Scripts, D1, Pages: Edit — see docs/DEPLOY.md)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable VITE_GOOGLE_CLIENT_ID  (public; baked into the web build)
# Worker secrets (SESSION_SECRET, VAPID_PRIVATE_KEY, …) stay in Cloudflare and are kept on deploy.

name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # API tests use the built-in node:sqlite
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    # Only real pushes to main deploy; pull requests (including from forks) only run tests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://emi-tracker-au4.pages.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check Cloudflare credentials are configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable (see docs/DEPLOY.md)."
            exit 1
          fi

      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply emi_tracker --remote --env=""

      - name: Deploy API Worker
        working-directory: apps/api
        # The tag (git commit) surfaces at runtime via the version metadata binding (Settings → About).
        run: npx wrangler deploy --env="" --tag "$GITHUB_SHA" --message "Deployed by GitHub Actions run $GITHUB_RUN_NUMBER"

      - name: Build web app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build -w @emi/web

      - name: Deploy web app to Pages
        working-directory: apps/web
        env:
          # Passed via env (never interpolated into the script) to avoid shell injection.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          npx wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-200)"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://emi-tracker-au4.pages.dev/api/health | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::Health check failed after deploy"; exit 1
